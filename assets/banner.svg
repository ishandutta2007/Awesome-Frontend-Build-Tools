<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:0 0;overflow:hidden;border-radius:16px"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#161e38"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="shimmer" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".2"/></linearGradient><linearGradient id="border-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".3"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".6"/></linearGradient><filter id="glow-blur" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="24"/></filter></defs><style>@keyframes float1{0%{transform:translate(0,0) scale(1);opacity:.35}}@keyframes float2{0%{transform:translate(0,0) scale(1);opacity:.3}}@keyframes beamPulse{0%{opacity:.2}50%{opacity:.65}}@keyframes nodeBlink{0%{r:4px;opacity:.4}50%{r:6.5px;opacity:1}}@keyframes badgeDrift{0%{transform:translateY(0)}}.glow-orb-1,.glow-orb-2{animation:float1 8s ease-in-out infinite alternate;transform-origin:center}.glow-orb-2{animation:float2 10s ease-in-out infinite alternate}.pulse-beam{animation:beamPulse 4s ease-in-out infinite alternate}.node-pulse{animation:nodeBlink 3s ease-in-out infinite alternate}.pipeline-dash{stroke-dasharray:8 6;animation:flowDash 20s linear infinite}.badge-float{animation:badgeDrift 6s ease-in-out infinite alternate}.title-text{font-weight:800;fill: