="translate(80, 0)">The definitive directory of high-performance module bundlers, compilers, dev servers &amp; CI/CD platforms.</text><g class="badge-float"><g transform="translate(80, 0) translate(0, 206) translate(0, 0)"><rect width="90" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="45" y="21.5" class="pill-label" text-anchor="middle">⚡ Vite 8</text></g><g transform="translate(80, 0) translate(0, 206) translate(102, 0)"><rect width="115" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="57" y="21.5" class="pill-label" text-anchor="middle">📦 Webpack 5</text></g><g transform="translate(80, 0) translate(0, 206) translate(229, 0)"><rect width="85" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="42" y="21.5" class="pill-label" text-anchor="middle">🥟 Bun</text></g><g transform="translate(80, 0) translate(0, 206) translate(326, 0)"><rect width="98" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="49" y="21.5" class="pill-label" text-anchor="middle">🚀 esbuild</text></g><g transform="translate(80, 0) translate(0, 206) translate(436, 0)"><rect width="122" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="61" y="21.5" class="pill-label" text-anchor="middle">🏎️ Turbopack</text></g><g transform="translate(80, 0) translate(0, 206) translate(570, 0)"><rect width="95" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="47" y="21.5" class="pill-label" text-anchor="middle">📜 Rollup</text></g><g transform="translate(80, 0) translate(0, 206) translate(677, 0)"><rect width="180" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="90" y="21.5" class="pill-label" text-anchor="middle">🦀 Rust: Rspack &amp; Rolldown</text></g></g><text x="0" y="278" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" trans